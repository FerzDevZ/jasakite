<!DOCTYPE html>
<html lang="id">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width, initial-scale=1">
<title>Offline — JASAKITE</title>
<style>
  body { margin:0; min-height:100dvh; display:grid; place-items:center;
         font-family:system-ui,-apple-system,"Segoe UI",Roboto,sans-serif;
         background:#FBFAF8; color:#292524; }
  .box { text-align:center; padding:32px; max-width:340px; }
  .logo { width:64px; height:64px; margin:0 auto 16px; border-radius:16px;
          background:linear-gradient(135deg,#F97316,#FDBA74); color:#fff;
          display:flex; align-items:center; justify-content:center;
          font-size:32px; font-weight:800; }
  h1 { font-size:20px; margin:0 0 8px; }
  p { font-size:14px; color:#78716C; margin:0 0 20px; line-height:1.5; }
  button { border:0; background:#EA580C; color:#fff; font-weight:700;
           padding:12px 28px; border-radius:12px; font-size:15px; }
</style>
</head>
<body>
  <div class="box">
    <div class="logo">J</div>
    <h1>Kamu sedang offline</h1>
    <p>Periksa koneksi internetmu, lalu coba lagi. Pesanan dan chat yang sudah terkirim tetap aman.</p>
    <button onclick="location.href='https://jasakite.vercel.app'">Coba lagi</button>
  </div>
</body>
</html>
