name: CI

on:
  push:
    branches: [main, master]
  pull_request:

# Batalkan run lama pada branch/PR yang sama: hanya commit terakhir yang relevan.
concurrency:
  group: ${{ github.workflow }}-${{ github.ref }}
  cancel-in-progress: true

jobs:
  verify:
    runs-on: ubuntu-latest
    timeout-minutes: 15

    # Database CI = MongoDB, sama seperti produksi dan `.env` lokal.
    #
    # Sebelumnya CI memakai `DATABASE_URL: file:./dev.db` (warisan era SQLite),
    # tetapi `prisma/schema.prisma` sudah `provider = "mongodb"` sejak commit
    # 83a4703. Akibatnya hampir setiap langkah yang menyentuh Prisma gagal duluan
    # dengan P1012 "the URL must start with the protocol `mongo`" — generate,
    # migrate, bahkan `next build` (beranda & sitemap me-query Prisma saat
    # prerender) — sehingga tes tidak pernah sempat dijalankan.

    env:
      # MongoDB (provider schema = mongodb) — bukan SQLite. `directConnection`
      # menunjuk tepat ke container ini: Prisma tidak mencari replica set yang
      # memang tidak ada di CI.
      DATABASE_URL: "mongodb://127.0.0.1:27017/jasakite_ci?replicaSet=rs0&w=majority"
      # NextAuth v5 menolak start tanpa dua env ini, termasuk saat `next build`
      # mengevaluasi route handler.
      AUTH_SECRET: "ci-placeholder-secret-not-used-in-production"
      AUTH_TRUST_HOST: "true"
      NEXTAUTH_URL: "http://localhost:3000"

    steps:
      - uses: actions/checkout@v4
      # MongoDB HARUS replica set tunggal: Prisma menjalankan upsert MongoDB
      # lewat transaksi (P2031 pada standalone), jadi seed gagal selama CI
      # masih memakai mongod standalone. Container services GitHub tidak bisa
      # diberi flag mongod, maka mongo dijalankan manual di sini.
      - name: Siapkan MongoDB (replica set tunggal rs0)
        run: |
          docker run -d --name mongodb -p 27017:27017 mongo:7 --replSet rs0 --bind_ip_all
          for i in $(seq 1 30); do
            docker exec mongodb mongosh --quiet --eval "db.runCommand({ ping: 1 }).ok" 2>/dev/null | grep -q 1 && break
            sleep 2
          done
          docker exec mongodb mongosh --quiet --eval 'try { rs.initiate({_id:"rs0",members:[{_id:0,host:"127.0.0.1:27017"}]}) } catch (e) { }'
          for i in $(seq 1 30); do
            docker exec mongodb mongosh --quiet --eval "db.hello().isWritablePrimary" 2>/dev/null | grep -q true && echo "PRIMARY siap" && exit 0
            sleep 2
          done
          echo "::error::MongoDB replica set tidak kunjung punya PRIMARY dalam 60 detik"
          exit 1


      - uses: actions/setup-node@v4
        with:
          node-version: 20
          cache: npm

      # `npm ci` menuntut package-lock.json sinkron dengan package.json —
      # itu memang yang kita inginkan sebagai pagar di CI.
      - name: Install dependencies
        run: npm ci

      # Harus SETELAH `npm ci`: lifecycle `prepare` yang memasang hook baru
      # berjalan di situ. Kalau diperiksa lebih dulu, checkout bersih belum
      # punya `.git/hooks/pre-push` dan gerbang ini gagal karena alasan yang
      # salah — bukan karena drift yang ingin dideteksi.
      - name: Verify git hooks
        run: npm run hooks:check

      - name: Generate Prisma client
        run: npx prisma generate

      # Migrasi + seed dijalankan supaya build punya database yang valid dan
      # skema yang sama dengan yang diharapkan kode.
      #
      # `db push`, BUKAN `migrate deploy`: MongoDB tidak memakai direktori
      # migrasi (provider schema = mongodb), dan `prisma/migrations/` yang ada
      # adalah warisan era SQLite (migration_lock.toml bertuliskan "sqlite").
      - name: Prepare database
        run: |
          set -o pipefail
          # Log langkah ini ditulis ke annotation saat gagal (jalur publik —
          # unduhan log penuh butuh hak admin repo) supaya penyebabnya bisa
          # dibaca tanpa membuka Actions.
          (npx prisma db push --skip-generate && node prisma/seed.js) 2>&1 | tee db-prep.log || {
            echo "::error::Gagal menyiapkan database CI: $(tail -c 700 db-prep.log | tr '\n' ' ')"
            exit 1
          }

      - name: Typecheck
        run: npm run typecheck

      - name: Unit tests
        run: npm test -- --run

      # Audit DNS domain (`jasakite.id`) sengaja dipisah dari langkah unit di
      # atas: domainnya memang belum terdaftar, jadi tes itu akan gagal di
      # setiap run. Tetap dijalankan agar sinyalnya terlihat di CI, tetapi tidak
      # memblokir — `continue-on-error` menandainya sebagai peringatan, bukan
      # kegagalan job. Aktifkan juga lokal dengan `npm run test:branding-dns`.
      - name: Audit DNS domain (non-blocking)
        run: npm run test:branding-dns
        continue-on-error: true

      - name: Build
        run: |
          set -o pipefail
          npm run build 2>&1 | tee build.log || {
            echo "::error::Build produksi gagal: $(grep -iE 'error|failed|✗' build.log | tail -c 700 | tr '\n' ' ')"
            exit 1
          }

      # Verifikasi runtime: server produksi harus benar-benar melayani rute,
      # bukan hanya berhasil di-build. Tanpa langkah ini, kesalahan yang hanya
      # muncul saat render (mis. kueri Prisma di server component) lolos CI.
      - name: Smoke test rute produksi
        run: |
          npm run start &
          SERVER_PID=$!
          trap 'kill $SERVER_PID 2>/dev/null || true' EXIT

          for i in $(seq 1 30); do
            if curl -sf -o /dev/null http://localhost:3000/; then break; fi
            sleep 2
          done

          fail=0
          check() {
            code=$(curl -s -o /dev/null -w '%{http_code}' "http://localhost:3000$1")
            if [ "$code" != "$2" ]; then
              echo "FAIL $1 -> $code (harusnya $2)"
              fail=1
            else
              echo "ok   $1 -> $code"
            fi
          }

          check / 200
          check /services 200
          check /faq 200
          check /login 200
          check /register 200
          # Rute terproteksi harus me-redirect, bukan membocorkan halaman.
          check /dashboard 307
          check /checkout 307

          exit $fail

  e2e:
    runs-on: ubuntu-latest
    # Dua project (chromium + mobile-320) berjalan berurutan dengan workers:1;
    # terukur ±7–8 menit per project, ditambah build & seed.
    timeout-minutes: 40

    # Sama dengan job `verify`: MongoDB, bukan SQLite — lihat catatan di atas.

    env:
      DATABASE_URL: "mongodb://127.0.0.1:27017/jasakite_ci?replicaSet=rs0&w=majority"
      AUTH_SECRET: "ci-placeholder-secret-not-used-in-production"
      AUTH_TRUST_HOST: "true"

    steps:
      - uses: actions/checkout@v4
      # MongoDB HARUS replica set tunggal: Prisma menjalankan upsert MongoDB
      # lewat transaksi (P2031 pada standalone), jadi seed gagal selama CI
      # masih memakai mongod standalone. Container services GitHub tidak bisa
      # diberi flag mongod, maka mongo dijalankan manual di sini.
      - name: Siapkan MongoDB (replica set tunggal rs0)
        run: |
          docker run -d --name mongodb -p 27017:27017 mongo:7 --replSet rs0 --bind_ip_all
          for i in $(seq 1 30); do
            docker exec mongodb mongosh --quiet --eval "db.runCommand({ ping: 1 }).ok" 2>/dev/null | grep -q 1 && break
            sleep 2
          done
          docker exec mongodb mongosh --quiet --eval 'try { rs.initiate({_id:"rs0",members:[{_id:0,host:"127.0.0.1:27017"}]}) } catch (e) { }'
          for i in $(seq 1 30); do
            docker exec mongodb mongosh --quiet --eval "db.hello().isWritablePrimary" 2>/dev/null | grep -q true && echo "PRIMARY siap" && exit 0
            sleep 2
          done
          echo "::error::MongoDB replica set tidak kunjung punya PRIMARY dalam 60 detik"
          exit 1


      - uses: actions/setup-node@v4
        with:
          node-version: 20
          cache: npm

      - name: Install dependencies
        run: npm ci

      # Lihat catatan di job `verify`: pemeriksaan hook butuh hook yang sudah
      # dipasang oleh `prepare` saat `npm ci`.
      - name: Verify git hooks
        run: npm run hooks:check

      # Cache browser Playwright: unduhannya ~130 MB, tanpa cache setiap run
      # menghabiskan menit hanya untuk mengunduh ulang.
      - name: Cache Playwright browsers
        uses: actions/cache@v4
        id: playwright-cache
        with:
          path: ~/.cache/ms-playwright
          key: playwright-${{ runner.os }}-${{ hashFiles('package-lock.json') }}

      - name: Install Playwright chromium
        run: npx playwright install --with-deps chromium

      - name: Prepare database
        run: |
          set -o pipefail
          # Sama seperti job verify: kegagalan ditulis ke annotation agar
          # terbaca publik tanpa hak admin (lihat komentar di job verify).
          (npx prisma generate && npx prisma db push --skip-generate && node prisma/seed.js) 2>&1 | tee db-prep.log || {
            echo "::error::Gagal menyiapkan database CI (e2e): $(tail -c 700 db-prep.log | tr '\n' ' ')"
            exit 1
          }

      # Build ke folder khusus E2E (`.next-e2e`, lihat next.config.mjs). Di CI
      # tidak ada `next dev` yang berjalan, tetapi jalur yang dipakai harus sama
      # dengan jalur lokal supaya kegagalan "tidak menemukan build produksi"
      # tidak hanya muncul di mesin pengembang.
      - name: Build (khusus E2E)
        run: npm run build:e2e

      # playwright.config.ts menjalankan `npm run start:e2e` sendiri lewat
      # webServer, jadi tidak perlu start manual di sini.
      # CI hanya memasang Chromium (langkah "Install Playwright chromium" di
      # atas), jadi project iPhone SE/WebKit sengaja TIDAK ikut — aktifkan
      # dengan E2E_WEBKIT=1 setelah `npx playwright install webkit`.
      - name: E2E tests
        run: npm run test:e2e

      - name: Upload laporan kegagalan
        if: failure()
        uses: actions/upload-artifact@v4
        with:
          name: playwright-report
          path: |
            playwright-report/
            test-results/
          retention-days: 7
