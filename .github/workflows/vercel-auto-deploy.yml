name: Vercel Auto Deploy (fallback)

# Cadangan deploy VIA API — deploy utama sebenarnya dijalankan integrasi
# git Vercel pada setiap push ke main (terverifikasi aktif). Workflow ini
# butuh secret VERCEL_TOKEN; tanpa token ia melompat dengan pemberitahuan
# alih-alih merah permanen di setiap push seperti sebelumnya.
on:
  push:
    branches: [main]
  workflow_dispatch:

jobs:
  deploy:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v4
        with:
          node-version: 20
          cache: npm
      - name: Cek token Vercel
        id: cek
        env:
          VERCEL_TOKEN: ${{ secrets.VERCEL_TOKEN }}
        run: |
          if [ -z "$VERCEL_TOKEN" ]; then
            echo "::notice::Secret VERCEL_TOKEN belum di-set — deploy fallback dilewati. Deploy utama tetap berjalan lewat integrasi git Vercel."
            echo "ada_token=no" >> "$GITHUB_OUTPUT"
          else
            echo "ada_token=yes" >> "$GITHUB_OUTPUT"
          fi
      - run: npm ci
        if: steps.cek.outputs.ada_token == 'yes'
      - run: npx vercel pull --yes --environment=production --token=${{ secrets.VERCEL_TOKEN }}
        if: steps.cek.outputs.ada_token == 'yes'
      - run: npx vercel build --prod --token=${{ secrets.VERCEL_TOKEN }}
        if: steps.cek.outputs.ada_token == 'yes'
      - run: npx vercel deploy --prebuilt --prod --token=${{ secrets.VERCEL_TOKEN }}
        if: steps.cek.outputs.ada_token == 'yes'
        env:
          VERCEL_ORG_ID: ${{ secrets.VERCEL_ORG_ID }}
          VERCEL_PROJECT_ID: ${{ secrets.VERCEL_PROJECT_ID }}
