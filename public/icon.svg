<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 512 512" width="512" height="512">
  <defs>
    <linearGradient id="bg" x1="0" y1="0" x2="1" y2="1">
      <stop offset="0" stop-color="#FBFAF8"/>
      <stop offset="1" stop-color="#F3F0EB"/>
    </linearGradient>
    <linearGradient id="accent" x1="0" y1="0" x2="1" y2="1">
      <stop offset="0" stop-color="#F97316"/>
      <stop offset="1" stop-color="#EA580C"/>
    </linearGradient>
  </defs>
  <!-- soft background -->
  <rect width="512" height="512" rx="96" fill="url(#bg)"/>
  <!-- brand mark: rounded square with J monogram + dot -->
  <g transform="translate(64 64)">
    <rect x="0" y="0" width="384" height="384" rx="72" fill="url(#accent)"/>
    <text x="192" y="222" font-family="Arial, Helvetica, sans-serif" font-size="172" font-weight="900" fill="#FFFFFF" text-anchor="middle">
      J
    </text>
    <circle cx="300" cy="300" r="28" fill="#FBFAF8"/>
  </g>
  <!-- safety margin hint (does not affect visible appearance) -->
</svg>
